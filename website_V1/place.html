<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jahrhunderthalle – SenseMap</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <h1>📍 Jahrhunderthalle Bochum</h1>
  </header>

  <main class="place-details">
    <p><strong>Status:</strong> Barrierefrei für Rollstuhlfahrer:innen ✔️</p>
    <p><strong>Kommentar:</strong> Rampen vorhanden, aber schmale Türen.</p>
    <hr>
    <h3>Bewertung abgeben</h3>
    <form>
      <label for="rating">Sterne:</label>
      <input type="number" id="rating" min="1" max="5" />
      <textarea placeholder="Deine Meinung..."></textarea>
      <button type="submit">Bewerten</button>
    </form>
  </main>

</body>
</html>
