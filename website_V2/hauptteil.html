<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bochum Karte</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
</head>
<body>

  <!-- Navbar mit Suchfunktion -->
  <nav class="navbar">
    <div class="logo">
      <img src="images/logo.png" alt="Bochum Karte" />
      <span>Bochum Karte</span>
    </div>
    <form class="search-form">
      <input type="text" placeholder="Suche nach Orten in Bochum..." />
      <button type="submit"><i class="fas fa-search"></i></button>
    </form>
  </nav>

  <!-- Hauptinhalt -->
  <main class="main-content">
    <!-- Karte -->
    <div id="map" class="map"></div>

    <!-- Floating Action Button zum Hindernis melden -->
    <button class="fab" id="report-button">
      <i class="fas fa-exclamation-triangle"></i>
    </button>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <ul>
      <li><a href="#" class="active"><i class="fas fa-map-marked-alt"></i> Karte</a></li>
      <li><a href="#"><i class="fas fa-exclamation-triangle"></i> Melden</a></li>
      <li><a href="#"><i class="fas fa-user"></i> Profil</a></li>
    </ul>
  </nav>

  <script>
    // Karte initialisieren
    var map = L.map('map').setView([51.4823, 7.2167], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>',
      subdomains: ['a', 'b', 'c']
    }).addTo(map);

    // Marker für Hindernisse und barrierefreie Orte
    var hindernisse = L.layerGroup().addTo(map);
    var barrierefreieOrte = L.layerGroup().addTo(map);

    // Beispiel-Marker
    var marker1 = L.marker([51.4823, 7.2167]).addTo(hindernisse);
    var marker2 = L.marker([51.4833, 7.2177]).addTo(barrierefreieOrte);

    // Marker-Styling
    hindernisse.eachLayer(function(layer) {
      layer.setIcon(L.icon({
        iconUrl: 'images/hindernis-marker.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        tooltipAnchor: [16, -28]
      }));
    });

    barrierefreieOrte.eachLayer(function(layer) {
      layer.setIcon(L.icon({
        iconUrl: 'images/barrierefreier-ort-marker.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        tooltipAnchor: [16, -28]
      }));
    });
  </script>
</body>
</html>
